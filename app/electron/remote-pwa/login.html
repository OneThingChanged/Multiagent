<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050c13" />
  <meta name="color-scheme" content="dark" />
  <title>Acedia Remote 로그인</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/pwa/styles.css" />
  <script type="module" src="/pwa/login.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">M</span>
      <span class="login-brand-text">
        <b>Acedia Remote</b>
        <span class="eyebrow">Secure remote access</span>
      </span>
    </div>

    <div id="loginReady">
      <h1 id="loginTitle">로그인 방식을 확인하는 중…</h1>
      <p class="login-copy" id="loginDescription">잠시만 기다려 주세요.</p>
      <button class="login-github-button login-start" id="startLogin" type="button" disabled>
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub로 로그인</span>
      </button>
    </div>

    <div class="device-panel" id="devicePanel" hidden>
      <span class="device-label">Device code</span>
      <strong class="device-code" id="deviceCode">----</strong>
      <p>버튼으로 GitHub를 열고 위 코드를 입력하세요. 인증이 끝나면 이 화면이 자동으로 넘어갑니다.</p>
      <div class="device-actions">
        <a class="device-link" id="deviceLink" href="https://github.com/login/device" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          <span>인증 페이지 열기</span>
        </a>
        <button class="device-copy" id="copyCode" type="button">복사</button>
      </div>
      <span class="login-progress" id="loginProgress"><i class="login-spin" aria-hidden="true"></i>GitHub 인증 대기 중…</span>
    </div>

    <div class="login-error" id="loginError" hidden></div>

    <p class="login-foot">세션 쿠키는 7일 후 만료되며, PC에서 승인을 해제하면 즉시 접근이 차단됩니다.</p>
  </main>
</body>
</html>
