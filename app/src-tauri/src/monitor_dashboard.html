<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiAgent Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101214;
        --panel: #181b1f;
        --panel-2: #20242a;
        --line: #303741;
        --text: #eef1f4;
        --muted: #9da7b3;
        --green: #27c08a;
        --amber: #e6b450;
        --red: #ec6a5e;
        --blue: #66aaff;
        --violet: #b48cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button {
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 6px;
        padding: 7px 10px;
        cursor: pointer;
      }
      button:hover {
        border-color: #596574;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: #14171a;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
        min-width: 0;
      }
      .top-left {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }
      .brand h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0;
      }
      .brand span {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .view-tabs {
        display: inline-flex;
        gap: 4px;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111417;
      }
      .view-tab {
        border: 0;
        background: transparent;
        color: var(--muted);
        padding: 6px 10px;
      }
      .view-tab.active {
        background: var(--panel-2);
        color: var(--text);
      }
      .summary {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 9px;
        color: var(--muted);
        background: #16191d;
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
        flex: 0 0 auto;
      }
      .dot.working,
      .dot.live {
        background: var(--green);
      }
      .dot.hook-missing,
      .dot.live-done {
        background: var(--amber);
      }
      .dot.stale,
      .dot.exited {
        background: var(--red);
      }
      .main {
        display: grid;
        grid-template-columns: minmax(360px, 520px) minmax(0, 1fr);
        min-height: 0;
      }
      .view.hidden {
        display: none;
      }
      .left,
      .right {
        min-height: 0;
        overflow: auto;
      }
      .left {
        border-right: 1px solid var(--line);
        background: #121518;
      }
      .section {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }
      .section-title {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .group-layout {
        display: flex;
        gap: 8px;
        min-height: 86px;
      }
      .group-layout.vertical {
        flex-direction: column;
      }
      .group-node {
        display: flex;
        gap: 8px;
        flex: 1 1 0;
        min-width: 0;
      }
      .group-node.vertical {
        flex-direction: column;
      }
      .leaf {
        flex: 1 1 0;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 10px;
      }
      .leaf.active {
        border-color: var(--blue);
      }
      .leaf-title,
      .session-title {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .leaf-name,
      .session-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }
      .leaf-meta,
      .session-meta {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .session-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .session {
        width: 100%;
        text-align: left;
        border-radius: 8px;
        padding: 10px;
        background: var(--panel);
        cursor: pointer;
      }
      .session.selected {
        border-color: var(--blue);
        background: #1b232d;
      }
      .session.active {
        box-shadow: inset 3px 0 0 var(--blue);
      }
      .badges {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 8px;
      }
      .session-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .mini-button {
        padding: 5px 8px;
        min-height: 28px;
        font-size: 12px;
      }
      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 2px 7px;
        color: var(--muted);
        font-size: 11px;
        line-height: 18px;
      }
      .badge.status-working,
      .badge.status-live {
        color: var(--green);
        border-color: rgba(39, 192, 138, 0.45);
      }
      .badge.status-hook-missing,
      .badge.status-live-done {
        color: var(--amber);
        border-color: rgba(230, 180, 80, 0.45);
      }
      .badge.status-stale,
      .badge.status-exited {
        color: var(--red);
        border-color: rgba(236, 106, 94, 0.45);
      }
      .right {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }
      .detail-head {
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: #15181c;
      }
      .detail-head h2 {
        margin: 0;
        font-size: 18px;
      }
      .detail-path {
        margin-top: 6px;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono",
          monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .detail-body {
        min-height: 0;
        display: grid;
        grid-template-columns: 360px minmax(0, 1fr);
      }
      .docs-list {
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 12px;
      }
      .doc-tree {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 12px;
      }
      .doc-folder {
        margin: 2px 0;
      }
      .doc-folder summary {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        list-style: none;
        padding: 4px 6px;
      }
      .doc-folder summary::-webkit-details-marker {
        display: none;
      }
      .doc-folder summary:hover,
      .doc-file:hover {
        background: #1d2229;
      }
      .doc-folder summary::before {
        content: "▾";
        color: var(--muted);
        font-size: 11px;
      }
      .doc-folder:not([open]) summary::before {
        content: "▸";
      }
      .doc-folder-children {
        margin-left: 14px;
        padding-left: 8px;
        border-left: 1px solid var(--line);
      }
      .doc-file {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 7px;
        min-height: 30px;
        text-align: left;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 5px 7px;
        background: transparent;
      }
      .doc-file.selected {
        border-color: var(--blue);
        background: #1b232d;
      }
      .doc-name {
        font-weight: 700;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .doc-file-kind {
        flex: 0 0 auto;
        min-width: 36px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 6px;
        font-size: 10px;
        text-transform: uppercase;
      }
      .preview {
        min-width: 0;
        overflow: auto;
        padding: 18px;
      }
      .preview-empty {
        color: var(--muted);
      }
      .markdown {
        max-width: 980px;
        line-height: 1.58;
      }
      .markdown h1,
      .markdown h2,
      .markdown h3 {
        margin: 20px 0 10px;
        letter-spacing: 0;
      }
      .markdown h1 {
        font-size: 24px;
      }
      .markdown h2 {
        font-size: 20px;
      }
      .markdown h3 {
        font-size: 16px;
      }
      .markdown p,
      .markdown ul,
      .markdown ol {
        margin: 8px 0;
      }
      .markdown code,
      .markdown pre {
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono",
          monospace;
      }
      .markdown code {
        background: #242932;
        border-radius: 4px;
        padding: 1px 4px;
      }
      .markdown pre {
        overflow: auto;
        background: #0d0f12;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }
      .html-frame {
        width: 100%;
        min-height: calc(100vh - 140px);
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
      }
      .error {
        color: var(--red);
      }
      .usage-view {
        min-height: 0;
        overflow: auto;
        padding: 18px;
      }
      .usage-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .usage-ranges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .usage-range.active {
        border-color: var(--blue);
        color: var(--text);
      }
      .usage-cards {
        display: grid;
        grid-template-columns: repeat(6, minmax(120px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }
      .usage-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }
      .usage-card-label {
        color: var(--muted);
        font-size: 12px;
      }
      .usage-card-value {
        margin-top: 8px;
        font-size: 20px;
        font-weight: 800;
      }
      .usage-grid {
        display: grid;
        grid-template-columns: minmax(280px, 420px) minmax(0, 1fr);
        gap: 14px;
      }
      .usage-panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }
      .usage-panel h2 {
        margin: 0;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        font-size: 14px;
      }
      .usage-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      .usage-table th,
      .usage-table td {
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      .usage-table th {
        color: var(--muted);
        font-weight: 700;
      }
      .usage-table td.num,
      .usage-table th.num {
        text-align: right;
        white-space: nowrap;
      }
      .usage-table .pathish {
        overflow-wrap: anywhere;
      }
      @media (max-width: 980px) {
        .main,
        .detail-body,
        .usage-grid,
        .usage-cards {
          grid-template-columns: 1fr;
        }
        .left,
        .docs-list {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .docs-list {
          max-height: 280px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="top-left">
          <div class="brand">
            <h1>MultiAgent Dashboard</h1>
            <span id="updated">waiting for data</span>
          </div>
          <nav class="view-tabs" aria-label="Dashboard view">
            <button id="monitorTab" class="view-tab active" type="button">Monitor</button>
            <button id="usageTab" class="view-tab" type="button">Usage</button>
          </nav>
        </div>
        <div id="summary" class="summary"></div>
      </header>
      <main id="monitorView" class="main view">
        <aside class="left">
          <section class="section">
            <h2 class="section-title">Active Group</h2>
            <div id="activeGroup" class="group-layout"></div>
          </section>
          <section class="section">
            <h2 class="section-title">Live Sessions</h2>
            <div id="sessions" class="session-list"></div>
          </section>
        </aside>
        <section class="right">
          <div id="detailHead" class="detail-head"></div>
          <div class="detail-body">
            <nav id="docsList" class="docs-list"></nav>
            <article id="preview" class="preview"></article>
          </div>
        </section>
      </main>
      <main id="usageView" class="usage-view view hidden">
        <div class="usage-toolbar">
          <div class="usage-ranges">
            <button class="usage-range active" data-range="today" type="button">Today</button>
            <button class="usage-range" data-range="week" type="button">7 days</button>
            <button class="usage-range" data-range="month" type="button">30 days</button>
            <button class="usage-range" data-range="all" type="button">All</button>
          </div>
          <button id="usageReindex" type="button">Reindex transcripts</button>
        </div>
        <section id="usageCards" class="usage-cards"></section>
        <section class="usage-grid">
          <div class="usage-panel">
            <h2>Projects</h2>
            <div id="usageProjects"></div>
          </div>
          <div class="usage-panel">
            <h2>Sessions</h2>
            <div id="usageSessions"></div>
          </div>
          <div class="usage-panel">
            <h2>Recent</h2>
            <div id="usageRecent"></div>
          </div>
          <div class="usage-panel">
            <h2>Timeline</h2>
            <div id="usageTimeline"></div>
          </div>
        </section>
      </main>
    </div>
    <script>
      let state = null;
      let activeView = "monitor";
      let selectedAgentId = null;
      let selectedDocPath = null;
      let usageRange = "today";
      let refreshTimer = null;

      const $ = (id) => document.getElementById(id);

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function statusLabel(status) {
        return {
          working: "working",
          live: "live",
          "live-done": "live done",
          "hook-missing": "hook missing",
          stale: "stale",
          running: "running",
          idle: "idle",
          exited: "exited",
        }[status] || status || "unknown";
      }

      function formatAge(ts) {
        if (!ts) return "no hook";
        const delta = Math.max(0, Date.now() - ts);
        if (delta < 60_000) return `${Math.floor(delta / 1000)}s ago`;
        if (delta < 3_600_000) return `${Math.floor(delta / 60_000)}m ago`;
        return `${Math.floor(delta / 3_600_000)}h ago`;
      }

      function formatTokens(value) {
        const n = Number(value || 0);
        if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(1)}M tokens`;
        if (n >= 1_000) return `${(n / 1_000).toFixed(1)}K tokens`;
        return `${n} tokens`;
      }

      function formatNumber(value) {
        return Number(value || 0).toLocaleString();
      }

      function formatUsageTime(ts) {
        if (!ts) return "";
        return new Date(Number(ts) * 1000).toLocaleString();
      }

      function sessionById(id) {
        return state?.sessions?.find((session) => session.id === id) || null;
      }

      function chooseSelectedAgent() {
        if (selectedAgentId && sessionById(selectedAgentId)) return;
        selectedAgentId =
          state?.activeAgentId ||
          state?.sessions?.find((session) => session.live)?.id ||
          state?.sessions?.[0]?.id ||
          null;
        selectedDocPath = null;
      }

      function renderSummary() {
        const totals = state?.totals || {};
        $("summary").innerHTML = [
          ["live", totals.live ?? 0, "live"],
          ["working", totals.working ?? 0, "working"],
          ["hook missing", totals.hookMissing ?? 0, "hook-missing"],
          ["docs", totals.docs ?? 0, ""],
          ["usage", formatTokens(totals.totalTokens ?? 0), ""],
        ]
          .map(
            ([label, value, cls]) =>
              `<span class="pill"><span class="dot ${cls}"></span>${value} ${label}</span>`
          )
          .join("");
        $("updated").textContent = state
          ? `updated ${new Date(state.generatedAt).toLocaleTimeString()}`
          : "waiting for data";
      }

      function renderLayoutNode(node) {
        if (!node) return "";
        if (node.type === "leaf") {
          const agentId = node.tabs?.[node.activeIndex || 0] || node.tabs?.[0];
          const session = sessionById(agentId);
          if (!session) {
            return '<div class="leaf"><div class="leaf-meta">empty leaf</div></div>';
          }
          const activeClass = session.active ? " active" : "";
          return `
            <button class="leaf${activeClass}" data-agent="${escapeHtml(session.id)}">
              <div class="leaf-title">
                <span class="dot ${escapeHtml(session.effectiveStatus)}"></span>
                <span class="leaf-name">${escapeHtml(session.name)}</span>
              </div>
              <div class="leaf-meta">${escapeHtml(session.projectName)} · ${escapeHtml(statusLabel(session.effectiveStatus))}</div>
              <div class="leaf-meta">${escapeHtml(session.folder)}</div>
            </button>
          `;
        }
        const vertical = node.direction === "v";
        const children = (node.children || []).map(renderLayoutNode).join("");
        return `<div class="group-node ${vertical ? "vertical" : ""}">${children}</div>`;
      }

      function renderActiveGroup() {
        const group =
          state?.groups?.find((candidate) => candidate.id === state.activeGroupId) ||
          state?.groups?.find((candidate) =>
            candidate.layout && JSON.stringify(candidate.layout).includes(state?.activeAgentId || "")
          );
        const target = $("activeGroup");
        if (!group) {
          target.innerHTML = '<div class="preview-empty">No active group synced yet.</div>';
          return;
        }
        target.innerHTML = renderLayoutNode(group.layout);
        target.querySelectorAll("[data-agent]").forEach((button) => {
          button.addEventListener("click", () => {
            selectedAgentId = button.dataset.agent;
            selectedDocPath = null;
            render();
          });
        });
      }

      function renderSessions() {
        const list = $("sessions");
        const sessions = state?.sessions || [];
        if (sessions.length === 0) {
          list.innerHTML = '<div class="preview-empty">No sessions synced yet.</div>';
          return;
        }
        list.innerHTML = sessions
          .map((session) => {
            const classes = [
              "session",
              selectedAgentId === session.id ? "selected" : "",
              session.active ? "active" : "",
            ]
              .filter(Boolean)
              .join(" ");
            const hookText = session.hook
              ? `${session.hook.event} · ${formatAge(session.hook.lastTs)}`
              : "no hook event";
            const reconnect =
              session.effectiveStatus === "hook-missing" &&
              (session.aiToolId === "codex" || session.aiToolId === "claude")
                ? `<div class="session-actions"><button class="mini-button" data-reconnect="${escapeHtml(session.id)}">Reconnect hooks</button></div>`
                : "";
            return `
              <div class="${classes}" data-agent="${escapeHtml(session.id)}">
                <div class="session-title">
                  <span class="dot ${escapeHtml(session.effectiveStatus)}"></span>
                  <span class="session-name">${escapeHtml(session.name)}</span>
                </div>
                <div class="session-meta">${escapeHtml(session.projectName)} · ${escapeHtml(session.aiToolId)} · ${escapeHtml(hookText)}</div>
                <div class="session-meta">${escapeHtml(session.folder)}</div>
                <div class="badges">
                  <span class="badge status-${escapeHtml(session.effectiveStatus)}">${escapeHtml(statusLabel(session.effectiveStatus))}</span>
                  <span class="badge">${session.docs.length} docs</span>
                  ${session.usage ? `<span class="badge">${escapeHtml(formatTokens(session.usage.totalTokens))}</span>` : ""}
                  ${session.lastSessionId ? `<span class="badge">${escapeHtml(session.lastSessionId)}</span>` : ""}
                </div>
                ${reconnect}
              </div>
            `;
          })
          .join("");
        list.querySelectorAll("[data-agent]").forEach((button) => {
          button.addEventListener("click", () => {
            selectedAgentId = button.dataset.agent;
            selectedDocPath = null;
            render();
          });
        });
        list.querySelectorAll("[data-reconnect]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            reconnectHooks(button.dataset.reconnect);
          });
        });
      }

      function renderDetailHead(session) {
        if (!session) {
          $("detailHead").innerHTML = "<h2>No session selected</h2>";
          return;
        }
        $("detailHead").innerHTML = `
          <h2>${escapeHtml(session.projectName)} / ${escapeHtml(session.name)}</h2>
          <div class="detail-path">${escapeHtml(session.folder)}</div>
          <div class="badges">
            <span class="badge status-${escapeHtml(session.effectiveStatus)}">${escapeHtml(statusLabel(session.effectiveStatus))}</span>
            <span class="badge">${escapeHtml(session.aiToolId)}</span>
            ${session.usage ? `<span class="badge">${escapeHtml(formatTokens(session.usage.totalTokens))}</span>` : ""}
            ${session.usage?.model ? `<span class="badge">${escapeHtml(session.usage.model)}</span>` : ""}
            ${session.active ? '<span class="badge">selected in MultiAgent</span>' : ""}
            ${session.hook ? `<span class="badge">${escapeHtml(session.hook.event)} · ${escapeHtml(formatAge(session.hook.lastTs))}</span>` : '<span class="badge status-hook-missing">hook missing</span>'}
          </div>
          ${
            session.effectiveStatus === "hook-missing" &&
            (session.aiToolId === "codex" || session.aiToolId === "claude")
              ? `<div class="session-actions"><button class="mini-button" data-detail-reconnect="${escapeHtml(session.id)}">Reconnect hooks</button></div>`
              : ""
          }
        `;
        $("detailHead").querySelector("[data-detail-reconnect]")?.addEventListener("click", (event) => {
          event.stopPropagation();
          reconnectHooks(session.id);
        });
      }

      async function reconnectHooks(agentId) {
        if (!agentId) return;
        $("updated").textContent = "reconnecting hooks...";
        try {
          const response = await fetch(`/api/hooks/reconnect?agentId=${encodeURIComponent(agentId)}`, {
            method: "POST",
          });
          const body = await response.json();
          if (!response.ok || body.error) throw new Error(body.error || "reconnect failed");
          $("updated").textContent = body.message || "hooks reconnected";
          await refresh();
        } catch (error) {
          $("updated").textContent = "hook reconnect failed";
          $("summary").innerHTML = `<span class="pill error">${escapeHtml(error.message || String(error))}</span>`;
        }
      }

      function setActiveView(view) {
        activeView = view;
        $("monitorView").classList.toggle("hidden", view !== "monitor");
        $("usageView").classList.toggle("hidden", view !== "usage");
        $("monitorTab").classList.toggle("active", view === "monitor");
        $("usageTab").classList.toggle("active", view === "usage");
        if (view === "usage") refreshUsage();
      }

      function usageQuery(params = {}) {
        const q = new URLSearchParams({ range: usageRange, ...params });
        return q.toString();
      }

      async function fetchJson(url, options) {
        const response = await fetch(url, options);
        const body = await response.json();
        if (!response.ok || body.error) throw new Error(body.error || "request failed");
        return body;
      }

      async function refreshUsage() {
        try {
          const [summary, projects, sessions, recent, timeline] = await Promise.all([
            fetchJson(`/api/usage/summary?${usageQuery()}`),
            fetchJson(`/api/usage/projects?${usageQuery()}`),
            fetchJson(`/api/usage/sessions?${usageQuery()}`),
            fetchJson(`/api/usage/recent?${usageQuery({ limit: "40" })}`),
            fetchJson(`/api/usage/timeseries?${usageQuery({ bucket: usageRange === "today" ? "hour" : "day" })}`),
          ]);
          renderUsage(summary, projects.projects || [], sessions.sessions || [], recent.events || [], timeline.buckets || []);
        } catch (error) {
          $("usageCards").innerHTML = `<div class="error">${escapeHtml(error.message || String(error))}</div>`;
        }
      }

      function renderUsage(summary, projects, sessions, recent, buckets) {
        $("usageCards").innerHTML = [
          ["Total", formatTokens(summary.totalTokens)],
          ["Input", formatTokens(summary.inputTokens)],
          ["Output", formatTokens(summary.outputTokens)],
          ["Cache read", formatTokens(summary.cacheReadTokens)],
          ["Reasoning", formatTokens(summary.reasoningOutputTokens)],
          ["Events", formatNumber(summary.events)],
        ]
          .map(
            ([label, value]) => `
              <div class="usage-card">
                <div class="usage-card-label">${escapeHtml(label)}</div>
                <div class="usage-card-value">${escapeHtml(value)}</div>
              </div>
            `
          )
          .join("");

        $("usageProjects").innerHTML = renderUsageTable(
          ["Project", "Sessions", "Total", "Last"],
          projects.map((project) => [
            project.projectName,
            project.sessionCount,
            formatTokens(project.totalTokens),
            formatUsageTime(project.lastTs),
          ]),
          [false, true, true, false]
        );

        $("usageSessions").innerHTML = renderUsageTable(
          ["Session", "Tool", "Model", "Total", "Last"],
          sessions.slice(0, 80).map((session) => [
            `${session.projectName} / ${session.agentName}`,
            session.tool,
            session.model || "",
            formatTokens(session.totalTokens),
            formatUsageTime(session.lastTs),
          ]),
          [false, false, false, true, false]
        );

        $("usageRecent").innerHTML = renderUsageTable(
          ["Time", "Agent", "Tool", "Total"],
          recent.map((event) => [
            formatUsageTime(event.ts),
            event.agentName || event.projectName || "",
            event.tool,
            formatTokens(event.totalTokens),
          ]),
          [false, false, false, true]
        );

        $("usageTimeline").innerHTML = renderUsageTable(
          ["Bucket", "Total", "Input", "Output", "Cache"],
          buckets.map((bucket) => [
            formatUsageTime(bucket.ts),
            formatTokens(bucket.totalTokens),
            formatTokens(bucket.inputTokens),
            formatTokens(bucket.outputTokens),
            formatTokens(bucket.cacheReadTokens),
          ]),
          [false, true, true, true, true]
        );
      }

      function renderUsageTable(headers, rows, numericColumns) {
        if (!rows.length) {
          return '<div class="preview-empty" style="padding: 12px;">No usage data.</div>';
        }
        return `
          <table class="usage-table">
            <thead>
              <tr>${headers.map((header, idx) => `<th class="${numericColumns[idx] ? "num" : ""}">${escapeHtml(header)}</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${rows
                .map(
                  (row) =>
                    `<tr>${row
                      .map((cell, idx) => `<td class="${numericColumns[idx] ? "num" : "pathish"}">${escapeHtml(cell)}</td>`)
                      .join("")}</tr>`
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      function renderDocs(session) {
        const list = $("docsList");
        if (!session) {
          list.innerHTML = "";
          $("preview").innerHTML = '<div class="preview-empty">Select a session.</div>';
          return;
        }
        if (session.docs.length === 0) {
          list.innerHTML = '<div class="preview-empty">No md/html docs found.</div>';
          $("preview").innerHTML = '<div class="preview-empty">No docs under this project folder.</div>';
          return;
        }
        if (!selectedDocPath || !session.docs.some((doc) => doc.path === selectedDocPath)) {
          selectedDocPath = session.docs[0].path;
          loadDoc(selectedDocPath);
        }
        list.innerHTML = `<div class="doc-tree">${renderDocTree(buildDocTree(session.docs))}</div>`;
        list.querySelectorAll("[data-path]").forEach((button) => {
          button.addEventListener("click", () => {
            selectedDocPath = button.dataset.path;
            renderDocs(session);
            loadDoc(selectedDocPath);
          });
        });
      }

      function buildDocTree(docs) {
        const root = { name: "", dirs: new Map(), files: [] };
        for (const doc of docs) {
          const parts = String(doc.relativePath || doc.name)
            .split(/[\\/]+/)
            .filter(Boolean);
          let node = root;
          for (const part of parts.slice(0, -1)) {
            if (!node.dirs.has(part)) {
              node.dirs.set(part, { name: part, dirs: new Map(), files: [] });
            }
            node = node.dirs.get(part);
          }
          node.files.push(doc);
        }
        return root;
      }

      function renderDocTree(node) {
        const dirs = Array.from(node.dirs.values()).sort((a, b) =>
          a.name.localeCompare(b.name)
        );
        const files = node.files
          .slice()
          .sort((a, b) => a.name.localeCompare(b.name));
        return `
          ${dirs
            .map(
              (dir) => `
                <details class="doc-folder" open>
                  <summary>${escapeHtml(dir.name)}</summary>
                  <div class="doc-folder-children">${renderDocTree(dir)}</div>
                </details>
              `
            )
            .join("")}
          ${files.map(renderDocFile).join("")}
        `;
      }

      function renderDocFile(doc) {
        const selected = doc.path === selectedDocPath ? " selected" : "";
        const kind = doc.kind === "html" ? "html" : "md";
        return `
          <button class="doc-file${selected}" data-path="${escapeHtml(doc.path)}" title="${escapeHtml(doc.relativePath)}">
            <span class="doc-file-kind">${escapeHtml(kind)}</span>
            <span class="doc-name">${escapeHtml(doc.name)}</span>
          </button>
        `;
      }

      async function loadDoc(path) {
        if (!path) return;
        $("preview").innerHTML = '<div class="preview-empty">Loading document...</div>';
        try {
          const response = await fetch(`/api/docs/read?path=${encodeURIComponent(path)}`);
          const body = await response.json();
          if (!response.ok || body.error) throw new Error(body.error || "read failed");
          if (body.kind === "html") {
            $("preview").innerHTML = `<iframe class="html-frame" sandbox="allow-same-origin allow-scripts" src="/api/docs/html?path=${encodeURIComponent(path)}"></iframe>`;
          } else {
            $("preview").innerHTML = renderMarkdown(body.content);
          }
        } catch (error) {
          $("preview").innerHTML = `<div class="error">${escapeHtml(error.message || String(error))}</div>`;
        }
      }

      function renderMarkdown(markdown) {
        const lines = String(markdown || "").split(/\r?\n/);
        let html = "";
        let inCode = false;
        let listOpen = false;
        for (const raw of lines) {
          const line = raw.replace(/\s+$/, "");
          if (line.startsWith("```")) {
            if (listOpen) {
              html += "</ul>";
              listOpen = false;
            }
            html += inCode ? "</code></pre>" : "<pre><code>";
            inCode = !inCode;
            continue;
          }
          if (inCode) {
            html += `${escapeHtml(line)}\n`;
            continue;
          }
          if (/^###\s+/.test(line)) {
            if (listOpen) {
              html += "</ul>";
              listOpen = false;
            }
            html += `<h3>${inlineMarkdown(line.replace(/^###\s+/, ""))}</h3>`;
          } else if (/^##\s+/.test(line)) {
            if (listOpen) {
              html += "</ul>";
              listOpen = false;
            }
            html += `<h2>${inlineMarkdown(line.replace(/^##\s+/, ""))}</h2>`;
          } else if (/^#\s+/.test(line)) {
            if (listOpen) {
              html += "</ul>";
              listOpen = false;
            }
            html += `<h1>${inlineMarkdown(line.replace(/^#\s+/, ""))}</h1>`;
          } else if (/^\s*[-*]\s+/.test(line)) {
            if (!listOpen) {
              html += "<ul>";
              listOpen = true;
            }
            html += `<li>${inlineMarkdown(line.replace(/^\s*[-*]\s+/, ""))}</li>`;
          } else if (line.trim() === "") {
            if (listOpen) {
              html += "</ul>";
              listOpen = false;
            }
          } else {
            if (listOpen) {
              html += "</ul>";
              listOpen = false;
            }
            html += `<p>${inlineMarkdown(line)}</p>`;
          }
        }
        if (inCode) html += "</code></pre>";
        if (listOpen) html += "</ul>";
        return `<div class="markdown">${html}</div>`;
      }

      function inlineMarkdown(value) {
        return escapeHtml(value).replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      function render() {
        chooseSelectedAgent();
        renderSummary();
        renderActiveGroup();
        renderSessions();
        const session = sessionById(selectedAgentId);
        renderDetailHead(session);
        renderDocs(session);
      }

      async function refresh() {
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          const body = await response.json();
          if (!response.ok || body.error) throw new Error(body.error || "state failed");
          state = body;
          render();
          if (activeView === "usage") refreshUsage();
        } catch (error) {
          $("updated").textContent = "refresh failed";
          $("summary").innerHTML = `<span class="pill error">${escapeHtml(error.message || String(error))}</span>`;
        }
      }

      $("monitorTab").addEventListener("click", () => setActiveView("monitor"));
      $("usageTab").addEventListener("click", () => setActiveView("usage"));
      document.querySelectorAll("[data-range]").forEach((button) => {
        button.addEventListener("click", () => {
          usageRange = button.dataset.range || "today";
          document.querySelectorAll("[data-range]").forEach((candidate) => {
            candidate.classList.toggle("active", candidate === button);
          });
          refreshUsage();
        });
      });
      $("usageReindex").addEventListener("click", async () => {
        $("usageReindex").textContent = "Reindexing...";
        try {
          await fetchJson("/api/usage/reindex", { method: "POST" });
          await refreshUsage();
        } catch (error) {
          $("usageCards").innerHTML = `<div class="error">${escapeHtml(error.message || String(error))}</div>`;
        } finally {
          $("usageReindex").textContent = "Reindex transcripts";
        }
      });

      refresh();
      refreshTimer = window.setInterval(refresh, 2000);
      window.addEventListener("beforeunload", () => {
        if (refreshTimer) window.clearInterval(refreshTimer);
      });
    </script>
  </body>
</html>
