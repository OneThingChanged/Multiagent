<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiAgent Usage</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #161b22;
        --panel-2: #0f141b;
        --panel-3: #111822;
        --line: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --blue: #58a6ff;
        --green: #3fb950;
        --orange: #d29922;
        --red: #f85149;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
        background: #010409;
        position: sticky;
        top: 0;
        z-index: 3;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 650;
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 7px 11px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      button.active {
        background: var(--blue);
        color: #06101f;
        font-weight: 650;
      }
      button.secondary {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
      }
      .status {
        color: var(--muted);
        margin-left: 12px;
        font-size: 12px;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .range {
        display: flex;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
      }
      main {
        max-width: 1500px;
        margin: 0 auto;
        padding: 18px 22px 28px;
      }
      .layout {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }
      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        overflow: hidden;
      }
      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--line);
        background: var(--panel-2);
      }
      .panel-body {
        padding: 14px;
      }
      .project-list {
        display: grid;
        gap: 6px;
        padding: 10px;
      }
      .project-row {
        width: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 4px 10px;
        align-items: center;
        padding: 10px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        text-align: left;
      }
      .project-row:hover {
        background: var(--panel-3);
      }
      .project-row.active-project {
        border-color: rgba(88, 166, 255, 0.55);
        background: rgba(88, 166, 255, 0.12);
      }
      .project-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 650;
      }
      .project-total {
        font-variant-numeric: tabular-nums;
        color: var(--blue);
        font-size: 12px;
      }
      .project-meta {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 11px;
      }
      .content {
        min-width: 0;
        display: grid;
        gap: 14px;
      }
      .context-title {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
        padding: 4px 2px 2px;
      }
      .context-title h2 {
        font-size: 20px;
      }
      .context-subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(6, minmax(120px, 1fr));
        gap: 10px;
      }
      .card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 13px;
      }
      .label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 8px;
      }
      .value {
        font-size: 21px;
        font-weight: 700;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.8fr);
        gap: 14px;
      }
      .chart {
        height: 280px;
        padding: 16px;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .bar-list {
        display: grid;
        gap: 10px;
        padding: 14px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: minmax(90px, 170px) minmax(0, 1fr) 94px;
        gap: 10px;
        align-items: center;
      }
      .bar-label {
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
      }
      .bar-track {
        height: 9px;
        border-radius: 999px;
        background: #222831;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        background: var(--green);
      }
      .bar-value {
        color: var(--muted);
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        background: var(--panel-2);
      }
      td.num, th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .muted {
        color: var(--muted);
      }
      .mono {
        font-family: Consolas, "SFMono-Regular", ui-monospace, monospace;
        font-size: 11px;
      }
      .session-group {
        border-top: 1px solid var(--line);
      }
      .session-group:first-child {
        border-top: 0;
      }
      .session-group-header {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 14px;
        background: var(--panel-2);
        color: var(--text);
        border-radius: 0;
        text-align: left;
      }
      .session-group-title {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 650;
      }
      .session-group-meta {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
      }
      .empty {
        padding: 14px;
        color: var(--muted);
      }
      @media (max-width: 1100px) {
        .layout, .grid {
          grid-template-columns: 1fr;
        }
        .project-list {
          grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
      }
      @media (max-width: 760px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }
        main {
          padding: 14px;
        }
        .cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .bar-row {
          grid-template-columns: 110px minmax(0, 1fr) 78px;
        }
        th.optional, td.optional {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>MultiAgent Usage</h1>
        <span class="status" id="status">Loading...</span>
      </div>
      <div class="header-actions">
        <button class="secondary" id="reindex">Reindex</button>
        <div class="range" id="range">
          <button data-range="today" class="active">Today</button>
          <button data-range="week">7 days</button>
          <button data-range="month">30 days</button>
          <button data-range="all">All</button>
        </div>
      </div>
    </header>
    <main>
      <div class="layout">
        <aside class="panel">
          <div class="panel-header">
            <h2>Projects</h2>
            <span class="muted" id="project-count"></span>
          </div>
          <div class="project-list" id="project-nav"></div>
        </aside>
        <section class="content">
          <div class="context-title">
            <div>
              <h2 id="context-name">All Projects</h2>
              <div class="context-subtitle" id="context-subtitle"></div>
            </div>
          </div>
          <section class="cards" id="cards"></section>
          <section class="grid">
            <div class="panel">
              <div class="panel-header">
                <h2>Token Trend</h2>
              </div>
              <div class="chart" id="trend"></div>
            </div>
            <div class="panel">
              <div class="panel-header">
                <h2 id="breakdown-title">Project Breakdown</h2>
              </div>
              <div class="bar-list" id="breakdown"></div>
            </div>
          </section>
          <section class="panel">
            <div class="panel-header">
              <h2>Sessions</h2>
              <span class="muted" id="session-count"></span>
            </div>
            <div id="sessions"></div>
          </section>
          <section class="panel">
            <div class="panel-header">
              <h2>Recent Events</h2>
            </div>
            <div id="recent"></div>
          </section>
        </section>
      </div>
    </main>
    <script>
      const state = {
        range: "today",
        selectedProjectId: "",
        projects: [],
        lastSessions: [],
        collapsedProjects: {},
      };

      const fmt = new Intl.NumberFormat();
      const timeFmt = new Intl.DateTimeFormat(undefined, {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
      const dayFmt = new Intl.DateTimeFormat(undefined, {
        month: "2-digit",
        day: "2-digit",
      });

      function n(value) {
        return fmt.format(value || 0);
      }

      function shortId(value) {
        if (!value) return "";
        return value.length > 8 ? value.slice(0, 8) : value;
      }

      function safe(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function ts(value) {
        return value ? timeFmt.format(new Date(value * 1000)) : "";
      }

      function api(path) {
        return fetch(path).then((r) => {
          if (!r.ok) throw new Error(path + " failed");
          return r.json();
        });
      }

      function queryBase(includeProject = true) {
        const params = new URLSearchParams({ range: state.range });
        if (includeProject && state.selectedProjectId) {
          params.set("projectId", state.selectedProjectId);
        }
        return params.toString();
      }

      function selectedProject() {
        if (!state.selectedProjectId) return null;
        return state.projects.find((p) => p.projectId === state.selectedProjectId) || null;
      }

      function renderContext(summary, sessions) {
        const project = selectedProject();
        document.getElementById("context-name").textContent = project
          ? project.projectName || "(unknown)"
          : "All Projects";
        const sessionLabel = project
          ? `${n(project.sessionCount)} sessions`
          : `${n(sessions.length)} sessions across ${n(state.projects.length)} projects`;
        document.getElementById("context-subtitle").textContent =
          `${sessionLabel} · ${n(summary.events)} usage events · ${n(summary.totalTokens)} tokens`;
      }

      function renderCards(summary) {
        const items = [
          ["Total", summary.totalTokens],
          ["Input", summary.inputTokens],
          ["Output", summary.outputTokens],
          ["Cache read", summary.cacheReadTokens],
          ["Cache write", summary.cacheWriteTokens],
          ["Reasoning", summary.reasoningOutputTokens],
        ];
        document.getElementById("cards").innerHTML = items
          .map(([label, value]) => `
            <div class="card">
              <div class="label">${label}</div>
              <div class="value">${n(value)}</div>
            </div>
          `)
          .join("");
      }

      function renderProjectNav(projects, allSummary) {
        const totalSessions = projects.reduce((sum, p) => sum + (p.sessionCount || 0), 0);
        document.getElementById("project-count").textContent = `${n(projects.length)}`;
        const allActive = !state.selectedProjectId ? " active-project" : "";
        const rows = [`
          <button class="project-row${allActive}" data-project-id="">
            <span class="project-name">All Projects</span>
            <span class="project-total">${n(allSummary.totalTokens)}</span>
            <span class="project-meta">
              <span>${n(totalSessions)} sessions</span>
              <span>${n(allSummary.events)} events</span>
            </span>
          </button>
        `];
        rows.push(
          ...projects.map((p) => {
            const active = p.projectId === state.selectedProjectId ? " active-project" : "";
            return `
              <button class="project-row${active}" data-project-id="${safe(p.projectId || "")}">
                <span class="project-name" title="${safe(p.projectName)}">${safe(p.projectName || "(unknown)")}</span>
                <span class="project-total">${n(p.totalTokens)}</span>
                <span class="project-meta">
                  <span>${n(p.sessionCount)} sessions</span>
                  <span>${ts(p.lastTs)}</span>
                </span>
              </button>
            `;
          })
        );
        document.getElementById("project-nav").innerHTML = rows.join("");
      }

      function renderTrend(buckets) {
        const el = document.getElementById("trend");
        if (!buckets.length) {
          el.innerHTML = '<div class="empty">No usage events in this range.</div>';
          return;
        }
        const max = Math.max(...buckets.map((b) => b.totalTokens), 1);
        const w = 900;
        const h = 250;
        const pad = 28;
        const points = buckets.map((b, i) => {
          const x = pad + (i * (w - pad * 2)) / Math.max(buckets.length - 1, 1);
          const y = h - pad - (b.totalTokens / max) * (h - pad * 2);
          return { x, y, b };
        });
        const path = points
          .map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`)
          .join(" ");
        const labels = points
          .filter((_, i) => i === 0 || i === points.length - 1)
          .map((p) => {
            const d = new Date(p.b.ts * 1000);
            const text = state.range === "today" ? timeFmt.format(d) : dayFmt.format(d);
            return `<text x="${p.x}" y="${h - 6}" fill="#8b949e" font-size="12" text-anchor="middle">${safe(text)}</text>`;
          })
          .join("");
        el.innerHTML = `
          <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Token trend">
            <line x1="${pad}" y1="${h - pad}" x2="${w - pad}" y2="${h - pad}" stroke="#30363d" />
            <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h - pad}" stroke="#30363d" />
            <path d="${path}" fill="none" stroke="#58a6ff" stroke-width="3" />
            ${points.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#58a6ff"><title>${n(p.b.totalTokens)} tokens</title></circle>`).join("")}
            <text x="${pad}" y="${pad - 8}" fill="#8b949e" font-size="12">${n(max)}</text>
            ${labels}
          </svg>
        `;
      }

      function renderBreakdown(projects, sessions) {
        const el = document.getElementById("breakdown");
        const title = document.getElementById("breakdown-title");
        const items = state.selectedProjectId
          ? sessions.map((s) => ({
              label: s.agentName || "(unknown)",
              sub: shortId(s.sessionId || ""),
              value: s.totalTokens,
            }))
          : projects.map((p) => ({
              label: p.projectName || "(unknown)",
              sub: `${n(p.sessionCount)} sessions`,
              value: p.totalTokens,
            }));
        title.textContent = state.selectedProjectId ? "Session Breakdown" : "Project Breakdown";
        if (!items.length) {
          el.innerHTML = '<div class="empty">No usage yet.</div>';
          return;
        }
        const max = Math.max(...items.map((item) => item.value), 1);
        el.innerHTML = items
          .slice(0, 14)
          .map((item) => `
            <div class="bar-row">
              <div class="bar-label" title="${safe(item.label)}">${safe(item.label)}<div class="muted">${safe(item.sub)}</div></div>
              <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2, (item.value / max) * 100)}%"></div></div>
              <div class="bar-value">${n(item.value)}</div>
            </div>
          `)
          .join("");
      }

      function sessionRows(sessions) {
        return `
          <table>
            <thead>
              <tr>
                <th>Session</th>
                <th>Tool</th>
                <th class="optional">Model</th>
                <th>Last</th>
                <th class="num optional">Input</th>
                <th class="num optional">Output</th>
                <th class="num">Cache</th>
                <th class="num optional">Reasoning</th>
                <th class="num">Total</th>
              </tr>
            </thead>
            <tbody>
              ${sessions.map((s) => `
                <tr>
                  <td>
                    ${safe(s.agentName || "(unknown)")}
                    <div class="muted mono">${safe(shortId(s.sessionId || ""))}</div>
                  </td>
                  <td>${safe(s.tool)}</td>
                  <td class="optional">${safe(s.model || "")}</td>
                  <td>${ts(s.lastTs)}</td>
                  <td class="num optional">${n(s.inputTokens)}</td>
                  <td class="num optional">${n(s.outputTokens)}</td>
                  <td class="num">${n((s.cacheReadTokens || 0) + (s.cacheWriteTokens || 0))}</td>
                  <td class="num optional">${n(s.reasoningOutputTokens)}</td>
                  <td class="num">${n(s.totalTokens)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      function renderSessions(sessions) {
        state.lastSessions = sessions;
        const el = document.getElementById("sessions");
        document.getElementById("session-count").textContent = `${n(sessions.length)}`;
        if (!sessions.length) {
          el.innerHTML = '<div class="empty">No session usage yet.</div>';
          return;
        }
        if (state.selectedProjectId) {
          el.innerHTML = sessionRows(sessions);
          return;
        }
        const grouped = new Map();
        for (const session of sessions) {
          const key = session.projectId || "(unknown)";
          if (!grouped.has(key)) {
            grouped.set(key, {
              id: key,
              name: session.projectName || "(unknown)",
              total: 0,
              sessions: [],
            });
          }
          const group = grouped.get(key);
          group.total += session.totalTokens || 0;
          group.sessions.push(session);
        }
        el.innerHTML = Array.from(grouped.values())
          .sort((a, b) => b.total - a.total)
          .map((group) => {
            const collapsed = !!state.collapsedProjects[group.id];
            return `
              <section class="session-group">
                <button class="session-group-header" data-toggle-project="${safe(group.id)}">
                  <span class="session-group-title">${collapsed ? ">" : "v"} ${safe(group.name)}</span>
                  <span class="session-group-meta">${n(group.sessions.length)} sessions · ${n(group.total)} tokens</span>
                </button>
                ${collapsed ? "" : sessionRows(group.sessions)}
              </section>
            `;
          })
          .join("");
      }

      function renderRecent(events) {
        const el = document.getElementById("recent");
        if (!events.length) {
          el.innerHTML = '<div class="empty">No recent events.</div>';
          return;
        }
        el.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th class="optional">Project</th>
                <th>Session</th>
                <th>Tool</th>
                <th class="num">Total</th>
              </tr>
            </thead>
            <tbody>
              ${events.map((e) => `
                <tr>
                  <td>${timeFmt.format(new Date(e.ts * 1000))}</td>
                  <td class="optional">${safe(e.projectName || "")}</td>
                  <td>${safe(e.agentName || "")}</td>
                  <td>${safe(e.tool)}</td>
                  <td class="num">${n(e.totalTokens)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      }

      async function load() {
        const status = document.getElementById("status");
        status.textContent = "Refreshing...";
        try {
          const bucket = state.range === "today" ? "hour" : "day";
          const projectQuery = queryBase(true);
          const allQuery = queryBase(false);
          const [summary, allSummary, timeseries, projects, sessions, recent] = await Promise.all([
            api(`/api/summary?${projectQuery}`),
            api(`/api/summary?${allQuery}`),
            api(`/api/timeseries?${projectQuery}&bucket=${bucket}`),
            api(`/api/projects?${allQuery}`),
            api(`/api/sessions?${projectQuery}`),
            api(`/api/recent?${projectQuery}&limit=80`),
          ]);
          state.projects = projects.projects || [];
          if (
            state.selectedProjectId &&
            !state.projects.some((p) => p.projectId === state.selectedProjectId)
          ) {
            state.selectedProjectId = "";
          }
          const sessionList = sessions.sessions || [];
          renderContext(summary, sessionList);
          renderCards(summary);
          renderProjectNav(state.projects, allSummary);
          renderTrend(timeseries.buckets || []);
          renderBreakdown(state.projects, sessionList);
          renderSessions(sessionList);
          renderRecent(recent.events || []);
          status.textContent = `${n(summary.events)} events`;
        } catch (err) {
          status.textContent = err.message || "Failed to load usage";
        }
      }

      document.getElementById("range").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-range]");
        if (!button) return;
        state.range = button.dataset.range;
        document.querySelectorAll("button[data-range]").forEach((el) => {
          el.classList.toggle("active", el === button);
        });
        load();
      });

      document.getElementById("project-nav").addEventListener("click", (event) => {
        const row = event.target.closest("[data-project-id]");
        if (!row) return;
        state.selectedProjectId = row.dataset.projectId || "";
        load();
      });

      document.getElementById("sessions").addEventListener("click", (event) => {
        const toggle = event.target.closest("[data-toggle-project]");
        if (!toggle) return;
        const id = toggle.dataset.toggleProject;
        state.collapsedProjects[id] = !state.collapsedProjects[id];
        renderSessions(state.lastSessions || []);
      });

      document.getElementById("reindex").addEventListener("click", async () => {
        const status = document.getElementById("status");
        const button = document.getElementById("reindex");
        button.disabled = true;
        status.textContent = "Reindexing...";
        try {
          const summary = await fetch("/api/reindex", { method: "POST" }).then((r) => r.json());
          status.textContent = `${summary.files || 0} files, ${summary.events || 0} new events`;
          await load();
        } catch (err) {
          status.textContent = err.message || "Reindex failed";
        } finally {
          button.disabled = false;
        }
      });

      load();
      setInterval(load, 15000);
    </script>
  </body>
</html>
