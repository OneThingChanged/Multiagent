<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiAgent Remote</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body, #app { height: 100%; }
  body { background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; }

  #sidebar { width: 240px; flex: 0 0 auto; background: #0d1117;
    border-right: 1px solid #21262d; display: flex; flex-direction: column;
    overflow: hidden; }
  .sb-header { padding: 12px 14px; font-weight: 700; font-size: 14px;
    border-bottom: 1px solid #21262d; display: flex; align-items: center;
    justify-content: space-between; }
  .sb-logout { background: #21262d; color: #8b949e; border: 1px solid #30363d;
    border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  #projects { flex: 1; overflow-y: auto; padding: 6px; }
  .sb-project { margin-bottom: 4px; }
  .sb-project-head { width: 100%; text-align: left; background: transparent;
    border: none; color: #8b949e; font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: .04em; padding: 8px 8px 4px; }
  .sb-session { width: 100%; display: flex; align-items: center; gap: 8px;
    background: transparent; border: none; color: #c9d1d9; font-size: 12px;
    padding: 6px 8px 6px 14px; border-radius: 6px; cursor: pointer; text-align: left; }
  .sb-session:hover { background: #161b22; }
  .sb-session.active { background: #1f2937; }
  .sb-empty { color: #8b949e; font-size: 12px; padding: 6px 8px 6px 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: #6b7280; }
  .dot.running { background: #22c55e; }
  .dot.working { background: #eab308; animation: pulse 1.2s ease-in-out infinite; }
  .dot.starting { background: #eab308; }
  .dot.exited { background: #6b7280; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #tabs { display: flex; gap: 2px; background: #0d1117; border-bottom: 1px solid #21262d;
    overflow-x: auto; flex: 0 0 auto; min-height: 34px; }
  .tab { display: flex; align-items: center; gap: 6px; background: transparent;
    border: none; border-bottom: 2px solid transparent; color: #8b949e;
    font-size: 12px; padding: 7px 8px 7px 12px; cursor: pointer; white-space: nowrap; }
  .tab.active { color: #c9d1d9; border-bottom-color: #1f6feb; }
  .tab-close { background: transparent; border: none; color: #6b7280;
    font-size: 14px; cursor: pointer; padding: 0 2px; border-radius: 4px; }
  .tab-close:hover { color: #f87171; background: #21262d; }
  #term-area { flex: 1; min-height: 0; position: relative; }
  .term-host { position: absolute; inset: 0; padding: 4px; overflow: auto; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-header">
      <span>MultiAgent Remote</span>
      <button class="sb-logout" id="logout">로그아웃</button>
    </div>
    <div id="projects"></div>
  </aside>
  <main id="main">
    <div id="tabs"></div>
    <div id="term-area">
      <div id="empty">왼쪽에서 세션을 선택하세요</div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script>
const CR = String.fromCharCode(13);
const ESCC = String.fromCharCode(27);
const CRLF = CR + String.fromCharCode(10);
const $ = (s) => document.querySelector(s);
const esc = (s) => (s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

let view = { projects: [], agents: [] };
let openTabs = []; // agentId[]
let activeTab = null;
const pool = new Map(); // agentId -> { term, ws, host }

const TermCtor = window.Terminal && (window.Terminal.Terminal || window.Terminal);

$("#logout").onclick = async () => {
  try { await fetch("/auth/logout", { method: "POST" }); } catch {}
  location.reload();
};

async function loadView() {
  try {
    const res = await fetch("/api/view");
    if (!res.ok) { if (res.status === 401) location.reload(); return; }
    view = await res.json();
    if (!view.projects) view.projects = [];
    if (!view.agents) view.agents = [];
    pruneClosed();
    renderSidebar();
    renderTabs();
  } catch { /* transient */ }
}

function agentById(id) { return (view.agents || []).find((a) => a.id === id) || null; }
function agentsOf(projectId) { return (view.agents || []).filter((a) => a.projectId === projectId); }

function pruneClosed() {
  // Close tabs whose session no longer exists.
  const live = new Set((view.agents || []).map((a) => a.id));
  for (const id of [...openTabs]) {
    if (!live.has(id)) closeTab(id, true);
  }
}

function renderSidebar() {
  const el = $("#projects");
  el.innerHTML = "";
  for (const p of view.projects || []) {
    const pdiv = document.createElement("div");
    pdiv.className = "sb-project";
    const head = document.createElement("div");
    head.className = "sb-project-head";
    head.textContent = p.name;
    pdiv.appendChild(head);
    const sessions = agentsOf(p.id);
    if (sessions.length === 0) {
      const e = document.createElement("div");
      e.className = "sb-empty";
      e.textContent = "세션 없음";
      pdiv.appendChild(e);
    }
    for (const a of sessions) {
      const s = document.createElement("button");
      s.className = "sb-session" + (a.id === activeTab ? " active" : "");
      s.innerHTML = `<span class="dot ${esc(a.status)}"></span><span class="nm">${esc(a.name)}</span>`;
      s.onclick = () => openSession(a.id);
      pdiv.appendChild(s);
    }
    el.appendChild(pdiv);
  }
}

function renderTabs() {
  const el = $("#tabs");
  el.innerHTML = "";
  for (const id of openTabs) {
    const a = agentById(id);
    const tab = document.createElement("div");
    tab.className = "tab" + (id === activeTab ? " active" : "");
    const label = document.createElement("span");
    label.innerHTML = `<span class="dot ${a ? esc(a.status) : ""}"></span>${esc(a ? a.name : id)}`;
    label.style.display = "flex";
    label.style.alignItems = "center";
    label.style.gap = "6px";
    label.onclick = () => setActive(id);
    const close = document.createElement("button");
    close.className = "tab-close";
    close.textContent = "×";
    close.onclick = (ev) => { ev.stopPropagation(); closeTab(id); };
    tab.appendChild(label);
    tab.appendChild(close);
    el.appendChild(tab);
  }
}

function openSession(id) {
  if (!agentById(id)) return;
  ensureTerm(id);
  if (!openTabs.includes(id)) openTabs.push(id);
  setActive(id);
}

function setActive(id) {
  activeTab = id;
  const area = $("#term-area");
  const e = pool.get(id);
  $("#empty").style.display = e ? "none" : "flex";
  // Detach any other hosts, attach the active one.
  for (const [tid, entry] of pool) {
    if (tid !== id && entry.host.parentNode === area) area.removeChild(entry.host);
  }
  if (e && e.host.parentNode !== area) area.appendChild(e.host);
  renderSidebar();
  renderTabs();
  if (e) {
    requestAnimationFrame(() => { e.term.focus(); });
  }
}

function closeTab(id, silent) {
  openTabs = openTabs.filter((t) => t !== id);
  const e = pool.get(id);
  if (e) {
    try { if (e.ws) { e.ws.onclose = null; e.ws.close(); } } catch {}
    try { e.term.dispose(); } catch {}
    if (e.host.parentNode) e.host.parentNode.removeChild(e.host);
    pool.delete(id);
  }
  if (activeTab === id) {
    activeTab = openTabs[openTabs.length - 1] || null;
    if (activeTab) setActive(activeTab);
    else { $("#empty").style.display = "flex"; }
  }
  if (!silent) { renderSidebar(); renderTabs(); }
}

function ensureTerm(id) {
  if (pool.has(id)) return;
  const host = document.createElement("div");
  host.className = "term-host";
  const term = new TermCtor({
    fontSize: 13,
    fontFamily: '"Cascadia Mono", Consolas, "Courier New", monospace',
    cursorBlink: true,
    scrollback: 5000,
    theme: {
      background: "#0d1117",
      foreground: "#c9d1d9",
      cursor: "#f0f6fc",
      selectionBackground: "#264f78",
    },
  });
  term.open(host);
  term.onData((d) => {
    const e = pool.get(id);
    if (e && e.ws && e.ws.readyState === 1) {
      e.ws.send(JSON.stringify({ type: "input", data: d }));
    }
  });
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws?id=${encodeURIComponent(id)}`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === "error") {
          term.write(CRLF + ESCC + "[31m" + m.message + ESCC + "[0m" + CRLF);
        } else if (m.type === "resize" && m.cols >= 2 && m.rows >= 2) {
          // The desktop owns the PTY size; match it exactly so wrapping
          // is identical and we never fight over the terminal dimensions.
          try { term.resize(m.cols, m.rows); } catch {}
        }
      } catch {}
    } else {
      term.write(new Uint8Array(ev.data));
    }
  };
  ws.onclose = () => { term.write(CRLF + ESCC + "[2m[connection closed]" + ESCC + "[0m" + CRLF); };
  pool.set(id, { term, ws, host });
}
setInterval(loadView, 2000);
loadView();
</script>
</body>
</html>
