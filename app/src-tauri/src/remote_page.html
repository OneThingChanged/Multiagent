<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiAgent Remote</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body, #app { height: 100%; }
  body { background: #0d1117; color: #c9d1d9;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; }

  #sidebar { width: 240px; flex: 0 0 auto; background: #0d1117;
    border-right: 1px solid #21262d; display: flex; flex-direction: column;
    overflow: hidden; }
  .sb-header { padding: 12px 14px; font-weight: 700; font-size: 14px;
    border-bottom: 1px solid #21262d; display: flex; align-items: center;
    justify-content: space-between; }
  .sb-logout { background: #21262d; color: #8b949e; border: 1px solid #30363d;
    border-radius: 6px; padding: 3px 8px; font-size: 11px; cursor: pointer; }
  #projects { flex: 1; overflow-y: auto; padding: 6px; }
  .sb-project { margin-bottom: 4px; }
  .sb-project-head { width: 100%; text-align: left; background: transparent;
    border: none; color: #c9d1d9; font-weight: 600; font-size: 13px;
    padding: 7px 8px; border-radius: 6px; cursor: pointer; border-left: 2px solid transparent; }
  .sb-project.active > .sb-project-head { border-left-color: #1f6feb; background: #161b22; }
  .sb-project-head:hover { background: #161b22; }
  .sb-session { width: 100%; display: flex; align-items: center; gap: 8px;
    background: transparent; border: none; color: #c9d1d9; font-size: 12px;
    padding: 6px 8px 6px 18px; border-radius: 6px; cursor: pointer; text-align: left; }
  .sb-session:hover { background: #161b22; }
  .sb-session.active { background: #1f2937; }
  .sb-empty { color: #8b949e; font-size: 12px; padding: 6px 8px 6px 18px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: #6b7280; }
  .dot.running { background: #22c55e; }
  .dot.working { background: #eab308; animation: pulse 1.2s ease-in-out infinite; }
  .dot.starting { background: #eab308; }
  .dot.exited { background: #6b7280; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #workspace { flex: 1; min-width: 0; position: relative; }
  #layout-root { position: absolute; inset: 0; display: flex; }
  #empty-ws { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: #8b949e; font-size: 14px; }

  .split { display: flex; flex: 1; min-width: 0; min-height: 0; }
  .split.row { flex-direction: row; }
  .split.col { flex-direction: column; }
  .cell { min-width: 0; min-height: 0; display: flex; }
  .leaf { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column;
    border: 1px solid #161b22; }
  .leaf.focused { border-color: #1f6feb; }
  .tabbar { display: flex; gap: 2px; background: #0d1117; border-bottom: 1px solid #21262d;
    overflow-x: auto; flex: 0 0 auto; }
  .tab { display: flex; align-items: center; gap: 6px; background: transparent;
    border: none; border-bottom: 2px solid transparent; color: #8b949e;
    font-size: 12px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  .tab.active { color: #c9d1d9; border-bottom-color: #1f6feb; }
  .leaf-body { flex: 1; min-height: 0; position: relative; }
  .term-host { position: absolute; inset: 0; padding: 4px; }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-header">
      <span>MultiAgent Remote</span>
      <button class="sb-logout" id="logout">로그아웃</button>
    </div>
    <div id="projects"></div>
  </aside>
  <main id="workspace">
    <div id="layout-root"></div>
    <div id="empty-ws">왼쪽에서 프로젝트와 세션을 선택하세요</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const CR = String.fromCharCode(13);
const ESCC = String.fromCharCode(27);
const CRLF = CR + String.fromCharCode(10);
const $ = (s) => document.querySelector(s);
const esc = (s) => (s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

let view = null;
let lastLayoutSig = "";
const pool = new Map(); // agentId -> { term, fit, ws, host, ro }

const TermCtor = window.Terminal && (window.Terminal.Terminal || window.Terminal);
const FitCtor = window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon);

async function sendCommand(type, id) {
  try {
    await fetch("/api/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, id }),
    });
  } catch {}
  setTimeout(loadView, 150);
}

$("#logout").onclick = async () => {
  try { await fetch("/auth/logout", { method: "POST" }); } catch {}
  location.reload();
};

async function loadView() {
  try {
    const res = await fetch("/api/view");
    if (!res.ok) { if (res.status === 401) location.reload(); return; }
    view = await res.json();
    renderSidebar();
    renderWorkspace();
  } catch { /* transient */ }
}

function agentsOf(projectId) {
  return (view.agents || []).filter((a) => a.projectId === projectId);
}
function activeGroup() {
  return (view.groups || []).find((g) => g.id === view.activeGroupId) || null;
}
function collectActiveIds(node, out) {
  if (!node) return;
  if (node.type === "leaf") {
    const id = node.tabs[node.activeIndex];
    if (id) out.add(id);
  } else if (node.type === "split") {
    for (const c of node.children) collectActiveIds(c, out);
  }
}
function activeIdSet() {
  const set = new Set();
  const g = activeGroup();
  if (g) collectActiveIds(g.layout, set);
  return set;
}

function renderSidebar() {
  const el = $("#projects");
  const active = activeIdSet();
  el.innerHTML = "";
  for (const p of view.projects || []) {
    const pdiv = document.createElement("div");
    pdiv.className = "sb-project" + (p.id === view.activeProjectId ? " active" : "");
    const head = document.createElement("button");
    head.className = "sb-project-head";
    head.textContent = p.name;
    head.onclick = () => sendCommand("select-project", p.id);
    pdiv.appendChild(head);
    const sessions = agentsOf(p.id);
    if (sessions.length === 0) {
      const e = document.createElement("div");
      e.className = "sb-empty";
      e.textContent = "세션 없음";
      pdiv.appendChild(e);
    }
    for (const a of sessions) {
      const s = document.createElement("button");
      s.className = "sb-session" + (active.has(a.id) ? " active" : "");
      s.innerHTML = `<span class="dot ${esc(a.status)}"></span><span class="nm">${esc(a.name)}</span>`;
      s.onclick = () => sendCommand("select-agent", a.id);
      pdiv.appendChild(s);
    }
    el.appendChild(pdiv);
  }
}

function renderWorkspace() {
  const g = activeGroup();
  const sig = JSON.stringify({ gid: view.activeGroupId, layout: g ? g.layout : null });
  const visible = activeIdSet();
  if (sig === lastLayoutSig) {
    refreshTabLabels();
    return;
  }
  lastLayoutSig = sig;

  if (!g) {
    $("#layout-root").replaceChildren();
    $("#empty-ws").style.display = "flex";
    cleanupPool(new Set());
    return;
  }
  $("#empty-ws").style.display = "none";
  for (const id of visible) ensureTerm(id);
  cleanupPool(visible);
  $("#layout-root").replaceChildren(buildNode(g.layout));
  requestAnimationFrame(() => {
    for (const id of visible) {
      const e = pool.get(id);
      if (e) sendResize(e);
    }
  });
}

function refreshTabLabels() {
  // Update status dots in tabs/sidebar without rebuilding terminals.
  document.querySelectorAll("[data-agent-dot]").forEach((dot) => {
    const a = (view.agents || []).find((x) => x.id === dot.getAttribute("data-agent-dot"));
    dot.className = "dot " + (a ? a.status : "");
  });
}

function buildNode(node) {
  if (node.type === "leaf") {
    const wrap = document.createElement("div");
    wrap.className = "leaf";
    if (node.tabs.length > 1) {
      const tabbar = document.createElement("div");
      tabbar.className = "tabbar";
      node.tabs.forEach((tid, i) => {
        const a = (view.agents || []).find((x) => x.id === tid);
        const t = document.createElement("button");
        t.className = "tab" + (i === node.activeIndex ? " active" : "");
        t.innerHTML = `<span class="dot ${a ? esc(a.status) : ""}" data-agent-dot="${esc(tid)}"></span>${esc(a ? a.name : tid)}`;
        t.onclick = () => sendCommand("select-agent", tid);
        tabbar.appendChild(t);
      });
      wrap.appendChild(tabbar);
    }
    const body = document.createElement("div");
    body.className = "leaf-body";
    const id = node.tabs[node.activeIndex];
    const e = id ? pool.get(id) : null;
    if (e) body.appendChild(e.host);
    wrap.appendChild(body);
    return wrap;
  }
  const split = document.createElement("div");
  split.className = "split " + (node.direction === "h" ? "row" : "col");
  node.children.forEach((c, i) => {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.flexGrow = String((node.sizes && node.sizes[i]) || 1);
    cell.style.flexBasis = "0";
    cell.appendChild(buildNode(c));
    split.appendChild(cell);
  });
  return split;
}

function ensureTerm(id) {
  if (pool.has(id)) return;
  const host = document.createElement("div");
  host.className = "term-host";
  const term = new TermCtor({
    fontSize: 13,
    fontFamily: '"Cascadia Mono", Consolas, "Courier New", monospace',
    cursorBlink: true,
    scrollback: 5000,
    theme: {
      background: "#0d1117",
      foreground: "#c9d1d9",
      cursor: "#f0f6fc",
      selectionBackground: "#264f78",
    },
  });
  const fit = new FitCtor();
  term.loadAddon(fit);
  term.open(host);
  term.onData((d) => {
    const e = pool.get(id);
    if (e && e.ws && e.ws.readyState === 1) {
      e.ws.send(JSON.stringify({ type: "input", data: d }));
    }
  });
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws?id=${encodeURIComponent(id)}`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { const e = pool.get(id); if (e) sendResize(e); };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") {
      try {
        const m = JSON.parse(ev.data);
        if (m.type === "error") term.write(CRLF + ESCC + "[31m" + m.message + ESCC + "[0m" + CRLF);
      } catch {}
    } else {
      term.write(new Uint8Array(ev.data));
    }
  };
  const ro = new ResizeObserver(() => { const e = pool.get(id); if (e) sendResize(e); });
  ro.observe(host);
  pool.set(id, { term, fit, ws, host, ro });
}

function sendResize(e) {
  try { e.fit.fit(); } catch { return; }
  if (e.ws && e.ws.readyState === 1) {
    e.ws.send(JSON.stringify({ type: "resize", cols: e.term.cols, rows: e.term.rows }));
  }
}

function cleanupPool(visible) {
  for (const [id, e] of [...pool]) {
    if (!visible.has(id)) {
      try { e.ro.disconnect(); } catch {}
      try { if (e.ws) { e.ws.onclose = null; e.ws.close(); } } catch {}
      try { e.term.dispose(); } catch {}
      pool.delete(id);
    }
  }
}

window.addEventListener("resize", () => {
  for (const e of pool.values()) sendResize(e);
});
setInterval(loadView, 2000);
loadView();
</script>
</body>
</html>
